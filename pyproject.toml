[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cloudevent-lint"
version = "0.1.0"
description = "Offline CloudEvents JSON contract linting for CI"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "James Childs-Maidment", email = "10917363+thisbejim@users.noreply.github.com" }]
keywords = ["cloudevents", "lint", "validation", "json", "ci", "serverless"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.3,<9",
  "ruff>=0.12,<0.13",
]

[project.urls]
Homepage = "https://github.com/thisbejim/cloudevent-lint"
Repository = "https://github.com/thisbejim/cloudevent-lint"
Issues = "https://github.com/thisbejim/cloudevent-lint/issues"

[project.scripts]
cloudevent-lint = "cloudevent_lint.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.3,<9",
  "ruff>=0.12,<0.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cloudevent_lint"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
